name: Selfhost generations

# Manual, heavy gate: capture a fresh stage0/stage1 baseline from one source
# snapshot, then drive the existing stage2/stage3 generation checks. Ports are
# fixed by the TLS fixtures, so every suite runs sequentially inside
# tests/selfhost/capture_baseline.py.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Integration corpus workers
        required: false
        default: "4"
        type: choice
        options: [ "2", "4", "8" ]

concurrency:
  group: selfhost-generations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generations:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # llvm-sys 221.x (inkwell feature "llvm22-1") looks for LLVM 22.1 here.
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          # Import the official key into a repository-scoped keyring.
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # Install the clang/lld toolchain and LLVM development packages
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev libssl-dev time
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-22-cargo-

      - name: Validate baseline recorder
        run: python3 tests/selfhost/test_capture_baseline.py

      - name: Capture fresh stage0/stage1 baseline and run generations
        run: |
          set -euo pipefail
          python3 tests/selfhost/capture_baseline.py \
            --out "$RUNNER_TEMP/selfhost-generations" \
            --profile release --jobs "${{ inputs.jobs }}" --generations

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-generations-${{ github.run_id }}
          path: ${{ runner.temp }}/selfhost-generations
          if-no-files-found: warn
          retention-days: 30
