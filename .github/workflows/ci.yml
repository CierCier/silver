name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs of the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job runs the stage0 (Rust) compiler only. Stage1 is not built or
# tested in CI for now; use `nix run .#check` locally for the full gate.
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # llvm-sys 221.x (inkwell feature "llvm22-1") looks for LLVM 22.1 here.
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          # Import the official key into a repository-scoped keyring.
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # Install the clang/lld toolchain and LLVM development packages
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev libssl-dev time
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-22-cargo-

      - name: Build bootstrap tools and Rust FFI
        run: cargo build --release --workspace

      - name: Run stdlib suite with stage0
        run: python3 tests/run_tests.py --release --no-tui --jobs 4

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev libssl-dev time
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-llvm-22-cargo-

      - name: Build bootstrap tools and Rust FFI
        run: cargo build --release --workspace

      - name: Run stdlib suite with stage0
        run: python3 tests/run_tests.py --release --no-tui --jobs 4

  windows-x86_64:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      LLVM_VERSION: 22.1.8
    steps:
      - uses: actions/checkout@v5

      # The LLVM installer has no llvm-config.exe or static libraries, so stage0
      # links LLVM-C.dll through scripts/llvm-config-shim (docs/windows-port.md
      # §2). The release tarball also carries the llvm-c and generated Config
      # headers that the installer omits; keep only what the build needs.
      - name: Cache LLVM 22
        id: llvm-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}-llvm-c

      - name: Install LLVM 22
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          $archive = Join-Path $env:RUNNER_TEMP "$name.tar.xz"
          curl.exe --fail --silent --show-error --location -o $archive `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz"
          tar -xf $archive -C $env:RUNNER_TEMP `
            "$name/bin/LLVM-C.dll" "$name/bin/lld.exe" "$name/bin/lld-link.exe" `
            "$name/lib/LLVM-C.lib" "$name/include/llvm-c" "$name/include/llvm/Config"
          if ($LASTEXITCODE -ne 0) { throw "LLVM extraction failed" }
          Move-Item (Join-Path $env:RUNNER_TEMP $name) (Join-Path $env:RUNNER_TEMP "llvm")

      - name: Configure LLVM
        run: |
          $ErrorActionPreference = "Stop"
          $llvm = Join-Path $env:RUNNER_TEMP "llvm"
          $shim = Join-Path $env:RUNNER_TEMP "llvm-shim"
          cargo build --release --manifest-path scripts/llvm-config-shim/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "llvm-config shim build failed" }
          New-Item -ItemType Directory -Force -Path "$shim\bin" | Out-Null
          Copy-Item scripts/llvm-config-shim/target/release/llvm-config.exe "$shim\bin\"
          "SILVER_LLVM_ROOT=$llvm" >> $env:GITHUB_ENV
          "SILVER_LLVM_VERSION=$env:LLVM_VERSION" >> $env:GITHUB_ENV
          "SILVER_LLVM_HEADERS=$llvm\include" >> $env:GITHUB_ENV
          "LLVM_SYS_221_PREFIX=$shim" >> $env:GITHUB_ENV
          # LLVM-C.dll must resolve when agc runs; lld-link is the preferred linker.
          "$llvm\bin" >> $env:GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-llvm-22-cargo-

      - name: Build bootstrap tools and Rust FFI
        run: cargo build --release --workspace

      - name: Run stdlib suite with stage0
        run: python tests/run_tests.py --release --no-tui --jobs 4

  wasi-wasm32:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Same LLVM 22 pin as the native test job (wasm-ld ships in lld-22).
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev libssl-dev time
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Set up node (WASI test runner)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-22-cargo-

      - name: Run wasm stdlib suite
        # Runner auto-resolves to `node <shim>` for wasm targets; WASM_SKIP
        # in run_tests.py triages threads/sockets/raw-asm suites.
        run: python3 tests/run_tests.py --release --no-tui --jobs 4 --target wasm32-wasip1

  editor-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # tools/check.sh compares the Zed grammar rev with the current grammar.
          fetch-depth: 0
          # check.sh runs npm install scripts; they must not see the token.
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/tree-sitter-silver/package-lock.json
            tools/vscode/package-lock.json

      - name: Check grammar, Zed, and VS Code extensions
        run: tools/check.sh
