name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # llvm-sys 221.x (inkwell feature "llvm22-1") looks for LLVM 22.1 here.
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          # Import the official key into a repository-scoped keyring.
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # Install the clang/lld toolchain and LLVM development packages
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev libssl-dev time
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-22-cargo-

      - name: Build bootstrap tools and Rust FFI
        run: cargo build --release --workspace

      - name: Build Silver compiler
        run: target/release/agc build silver.toml --bin agc --no-cache -o "$RUNNER_TEMP/agc-stage1"

      - name: Run stdlib suite with stage0
        run: python3 tests/run_tests.py --release --no-tui --jobs 4

      - name: Run stdlib suite with native stage1
        run: python3 tests/run_tests.py --compiler "$RUNNER_TEMP/agc-stage1" --no-tui --jobs 4

  wasm:
    runs-on: ubuntu-24.04
    env:
      # Same LLVM 22 pin as the native test job (wasm-ld ships in lld-22).
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev libssl-dev time
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Set up node (WASI test runner)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-22-cargo-

      - name: Run wasm stdlib suite
        # Runner auto-resolves to `node <shim>` for wasm targets; WASM_SKIP
        # in run_tests.py triages threads/sockets/raw-asm suites.
        run: python3 tests/run_tests.py --release --no-tui --jobs 4 --target wasm32-wasip1
