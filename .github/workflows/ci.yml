name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # llvm-sys 221.x (inkwell feature "llvm22-1") looks for LLVM 22.1 here.
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          # Import the official key into a repository-scoped keyring.
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          sudo chmod 0644 /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # Install the clang/lld toolchain and LLVM development packages
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev libssl-dev time
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-llvm-22-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-22-cargo-

      - name: Run compiler unit tests
        run: cargo test --release -p agc

      - name: Run Rust FFI unit tests
        run: cargo test -p silver-ffi

      - name: Build Rust FFI artifacts
        run: cargo build -p silver-ffi

      - name: Validate C ABI consumer
        run: |
          clang-22 -std=c11 -Wall -Wextra -Werror \
            -I ffi/rust/include ffi/rust/tests/abi_smoke.c \
            -L target/debug -Wl,-rpath,"$GITHUB_WORKSPACE/target/debug" \
            -lsilver_ffi -o "$RUNNER_TEMP/silver_ffi_abi_smoke"
          "$RUNNER_TEMP/silver_ffi_abi_smoke"

      - name: Run Rust FFI Silver integration test
        run: |
          SILVER_FFI_LIBRARY_DIR="$GITHUB_WORKSPACE/target/debug" bash tests/run_tests.sh rust_ffi_test

      - name: Run integration tests
        run: bash tests/run_tests.sh --release
