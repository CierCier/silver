# silver.toml — Silver workspace manifest (self-host root).
#
# The repository root is a Silver project: `bin/agc/` (the stage1
# self-hosting compiler driver) and `libs/agc/` (its reusable frontend
# library), built stage-by-stage toward parity with bootstrap/stage0/agc.
#
# The Rust bootstrap lives under bootstrap/ (stage0) and is built with
# cargo from the same root; see docs/selfhost-plan.txt for the migration
# plan and docs/wasm-target.md for the wasm target survey.
#
# P0 goal: 1:1 linux/x86_64 frontend parity between bootstrap/stage0/agc
# (Rust) and bin/agc (Silver). The reusable frontend lives in libs/agc.
# Stage1 native commands use the Linux LLVM backend in libs/agc/src/backend/llvm/
# and vendor/llvm/llvm.ag. Unsupported constructs fail closed; stage0 is used
# only to bootstrap stage1 and is never launched by the stage1 executable.

name = "silver"
version = "0.2.6"
# NOTE (MIG-006): `default_target = "agc"` below matches two same-named targets
# ([bin."agc"] and [lib."agc"]). This is kind-namespaced, not a conflict: every
# caller passes `--bin agc` or `--lib agc` (see tests/selfhost/run_stage.sh,
# check_workspace.py:132-133), and a bare `agc build` resolves to the binary by
# manifest declaration order (bin first, cf. package.rs:519-531 first-match).
# Do NOT rename either target without updating check_workspace.py:133
# (`--lib agc`), bin/agc + bin/aglsp `import agc;` sites, and package.rs:1884-1887.
# The stdlib is not a manifest dependency — it arrives via source `import std.*`.
default_target = "agc"


# Stage1 frontend binary. Its target manifest lives in bin/agc; stage0
# builds this entry point with the commands in tests/selfhost/run_stage.sh.
# It owns the frontend and Linux native backend. Stage0 bootstraps the binary,
# but stage1 does not use stage0 for native commands.
[bin."agc"]
manifest = "./bin/agc"

# Reusable compiler frontend library. The binary package depends on this
# target, and tooling can consume the same library independently.
[lib."agc"]
manifest = "./libs/agc"

[bin."aglsp"]
manifest = "./bin/aglsp"

# The standard library is imported as source for now.
